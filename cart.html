<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang - Uji Jewelry Store</title>
  <link rel="stylesheet" href="style.css">
  <style>

    .cart-page-wrap { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .cart-page-wrap h1 { color: #7a3b53; margin-bottom: 20px; }
    .cart-page-item { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .cart-page-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; background: #eee; }
    .cart-page-info { flex: 1; }
    .cart-page-info h3 { font-size: 16px; margin-bottom: 4px; }
    .cart-page-price { color: #d17ca0; font-size: 14px; margin-bottom: 6px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-controls button { width: 26px; height: 26px; border: 1px solid #d17ca0; background: #fff; color: #d17ca0; border-radius: 50%; cursor: pointer; font-weight: bold; }
    .cart-page-subtotal { text-align: right; }
    .remove-item { display: block; margin-top: 6px; background: none; border: none; color: #c0392b; text-decoration: underline; cursor: pointer; font-size: 12px; }
    .cart-page-footer { background: #fff; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .cart-total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 16px; }
    .btn-checkout { width: 100%; background: #7a3b53; color: #fff; border: none; padding: 12px; border-radius: 25px; font-size: 15px; cursor: pointer; }
    .btn-checkout:hover { background: #5c2c3f; }
    .btn-checkout:disabled { background: #ccc; cursor: not-allowed; }
    .back-link { display: inline-block; margin-bottom: 16px; color: #7a3b53; text-decoration: none; font-weight: 600; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #fff; border-radius: 14px; width: 420px; max-width: 100%; max-height: 85vh; overflow-y: auto; padding: 26px; }
    .modal-box h2 { color: #7a3b53; margin-bottom: 16px; }
    .modal-box label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
    .modal-summary { background: #fdf6f0; padding: 12px; border-radius: 10px; margin-top: 16px; font-size: 14px; }
    .modal-summary div { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #eee; color: #333; }
    .btn-confirm { background: #d17ca0; color: #fff; }
    .success-box { text-align: center; padding: 10px 0; }
    .success-box .checkmark { font-size: 50px; color: #4caf50; }

    @media (max-width: 600px) {
      .cart-page-wrap { margin: 20px auto; padding: 0 14px; }
      .cart-page-wrap h1 { font-size: 20px; }

      .cart-page-item { flex-wrap: wrap; padding: 12px; gap: 10px; }
      .cart-page-item img { width: 60px; height: 60px; }
      .cart-page-info { flex: 1 1 60%; }
      .cart-page-info h3 { font-size: 14px; }
      .cart-page-subtotal { flex: 1 1 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; margin-top: 6px; }
      .remove-item { margin-top: 0; }

      .cart-page-footer { padding: 16px; }
      .cart-total-row { font-size: 16px; }

      .modal-box { width: 100%; padding: 20px; }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
      .cart-page-wrap { max-width: 90%; margin: 30px auto; }
      .cart-page-item img { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="navbar">
      <div class="logo">Uji Jewelry</div>
      <ul class="nav-links">
        <li><a href="index.html">Kembali Belanja</a></li>
      </ul>
    </nav>
  </header>

  <div class="cart-page-wrap">
    <a href="index.html" class="back-link">&larr; Kembali ke Toko</a>
    <h1>Keranjang Belanja</h1>

    <div id="cart-page-items">
      <!-- Diisi otomatis oleh script.js -->
    </div>

    <div class="cart-page-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-page-total">Rp 0</span>
      </div>
      <button class="btn-checkout" id="btn-checkout-page" onclick="bukaFormCheckout()" disabled>Checkout</button>
    </div>
  </div>

  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-box" id="checkout-modal-box">
      <h2>Checkout</h2>
      <form id="checkout-form" onsubmit="prosesCheckout(event)">
        <label for="nama">Nama Penerima</label>
        <input type="text" id="nama" required placeholder="Nama lengkap">

        <label for="alamat">Alamat Pengiriman</label>
        <textarea id="alamat" rows="2" required placeholder="Alamat lengkap"></textarea>

        <label for="telepon">Nomor Telepon</label>
        <input type="tel" id="telepon" required placeholder="08xxxxxxxxxx">

        <label for="pembayaran">Metode Pembayaran</label>
        <select id="pembayaran">
          <option value="Transfer Bank">Transfer Bank</option>
          <option value="COD">COD (Bayar di Tempat)</option>
          <option value="E-Wallet">E-Wallet</option>
        </select>

        <div class="modal-summary" id="checkout-summary"></div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="tutupFormCheckout()">Batal</button>
          <button type="submit" class="btn-confirm">Konfirmasi Pesanan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
