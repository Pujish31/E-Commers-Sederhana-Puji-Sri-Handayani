<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Uji Jewelry Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #fdf6f0; color: #3a2a2a; min-height: 100vh; }

    .login-wrap { max-width: 380px; margin: 80px auto; background: #fff; padding: 34px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .login-wrap h1 { color: #7a3b53; text-align: center; margin-bottom: 6px; font-size: 22px; }
    .login-wrap p.sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 22px; }
    .login-wrap label { display: block; font-size: 13px; font-weight: 600; margin-top: 14px; margin-bottom: 4px; }
    .login-wrap input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
    .login-wrap button { width: 100%; margin-top: 20px; background: #7a3b53; color: #fff; border: none; padding: 12px; border-radius: 25px; font-size: 15px; cursor: pointer; }
    .login-wrap button:hover { background: #5c2c3f; }
    .login-error { color: #c0392b; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

    .admin-wrap { display: none; max-width: 1100px; margin: 0 auto; padding: 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .admin-header h1 { color: #7a3b53; font-size: 22px; }
    .btn-logout { background: #eee; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #7a3b53; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; }
    .btn-primary:hover { background: #5c2c3f; }

    .admin-table-wrap { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #f0e4e8; font-size: 14px; }
    th { color: #7a3b53; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
    td img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; }
    .stok-input { width: 70px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; text-align: center; }
    .badge-habis { color: #c0392b; font-weight: bold; font-size: 12px; }
    .row-actions button { border: none; padding: 6px 10px; border-radius: 14px; font-size: 12px; cursor: pointer; margin-right: 4px; }
    .btn-edit { background: #fce8f0; color: #7a3b53; }
    .btn-delete { background: #fbe4e4; color: #c0392b; }
    .btn-save-stok { background: #e6f4ea; color: #2e7d32; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #fff; border-radius: 14px; width: 420px; max-width: 100%; max-height: 85vh; overflow-y: auto; padding: 26px; }
    .modal-box h2 { color: #7a3b53; margin-bottom: 16px; }
    .modal-box label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #eee; color: #333; }

    @media (max-width: 600px) {
      .admin-wrap { padding: 12px; }
      .admin-header { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

  <div class="login-wrap" id="login-wrap">
    <h1>Login Admin</h1>
    <p class="sub">Uji Jewelry Store</p>
    <form id="login-form">
      <label for="login-user">Username</label>
      <input type="text" id="login-user" required placeholder="Username">

      <label for="login-pass">Password</label>
      <input type="password" id="login-pass" required placeholder="Password">

      <button type="submit">Masuk</button>
      <p class="login-error" id="login-error">Username atau password salah.</p>
    </form>
  </div>


  <div class="admin-wrap" id="admin-wrap">
    <div class="admin-header">
      <h1>Kelola Produk</h1>
      <div>
        <button class="btn-primary" onclick="bukaModalTambah()">+ Tambah Produk</button>
        <button class="btn-logout" onclick="logoutAdmin()">Keluar</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Gambar</th>
            <th>Nama</th>
            <th>Kategori</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="admin-product-list">
          <!-- diisi otomatis -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="product-modal">
    <div class="modal-box">
      <h2 id="modal-title">Tambah Produk</h2>
      <form id="product-form" onsubmit="simpanProduk(event)">
        <input type="hidden" id="p-id">

        <label for="p-nama">Nama Produk</label>
        <input type="text" id="p-nama" required>

        <label for="p-harga">Harga (Rp)</label>
        <input type="number" id="p-harga" required min="0">

        <label for="p-gambar">Nama File Gambar</label>
        <input type="text" id="p-gambar" placeholder="contoh: produk.jpg" required>

        <label for="p-kategori">Kategori</label>
        <select id="p-kategori">
          <option value="Pink">Pink</option>
          <option value="Gold">Gold</option>
          <option value="Vintage">Vintage</option>
          <option value="Y2K">Y2K</option>
        </select>

        <label for="p-stok">Stok</label>
        <input type="number" id="p-stok" required min="0">

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="tutupModalProduk()">Batal</button>
          <button type="submit" class="btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="products-data.js"></script>
  <script>

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "admin123";

    function getProducts() {
      let produk = JSON.parse(localStorage.getItem("products"));
      if (!produk) {
        produk = window.defaultProducts || [];
        localStorage.setItem("products", JSON.stringify(produk));
      }
      return produk;
    }

    function saveProducts(produk) {
      localStorage.setItem("products", JSON.stringify(produk));
    }

    function formatRupiah(angka) {
      return "Rp " + Number(angka).toLocaleString("id-ID");
    }
    
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("login-user").value;
      const pass = document.getElementById("login-pass").value;

      if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        sessionStorage.setItem("isAdminLoggedIn", "true");
        tampilkanPanelAdmin();
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    });

    function logoutAdmin() {
      sessionStorage.removeItem("isAdminLoggedIn");
      document.getElementById("admin-wrap").style.display = "none";
      document.getElementById("login-wrap").style.display = "block";
      document.getElementById("login-form").reset();
    }

    function tampilkanPanelAdmin() {
      document.getElementById("login-wrap").style.display = "none";
      document.getElementById("admin-wrap").style.display = "block";
      renderTabelProduk();
    }

    function renderTabelProduk() {
      const produk = getProducts();
      const tbody = document.getElementById("admin-product-list");

      tbody.innerHTML = produk
        .map(
          (p, index) => `
        <tr>
          <td><img src="${p.gambar}" alt="${p.nama}" onerror="this.style.opacity=0.2"></td>
          <td>${p.nama}</td>
          <td>${p.kategori}</td>
          <td>${formatRupiah(p.harga)}</td>
          <td>
            <input type="number" class="stok-input" min="0" value="${p.stok}" id="stok-${index}">
            ${p.stok <= 0 ? '<div class="badge-habis">Habis</div>' : ""}
          </td>
          <td class="row-actions">
            <button class="btn-save-stok" onclick="updateStok(${index})">Simpan Stok</button>
            <button class="btn-edit" onclick="bukaModalEdit(${index})">Edit</button>
            <button class="btn-delete" onclick="hapusProduk(${index})">Hapus</button>
          </td>
        </tr>
      `
        )
        .join("");
    }

    function updateStok(index) {
      const produk = getProducts();
      const stokBaru = parseInt(document.getElementById("stok-" + index).value, 10);
      if (isNaN(stokBaru) || stokBaru < 0) return;
      produk[index].stok = stokBaru;
      saveProducts(produk);
      renderTabelProduk();
    }

    function hapusProduk(index) {
      if (!confirm("Yakin hapus produk ini?")) return;
      const produk = getProducts();
      produk.splice(index, 1);
      saveProducts(produk);
      renderTabelProduk();
    }

    let editIndex = null;

    function bukaModalTambah() {
      editIndex = null;
      document.getElementById("modal-title").innerText = "Tambah Produk";
      document.getElementById("product-form").reset();
      document.getElementById("product-modal").classList.add("active");
    }

    function bukaModalEdit(index) {
      editIndex = index;
      const produk = getProducts()[index];
      document.getElementById("modal-title").innerText = "Edit Produk";
      document.getElementById("p-nama").value = produk.nama;
      document.getElementById("p-harga").value = produk.harga;
      document.getElementById("p-gambar").value = produk.gambar;
      document.getElementById("p-kategori").value = produk.kategori;
      document.getElementById("p-stok").value = produk.stok;
      document.getElementById("product-modal").classList.add("active");
    }

    function tutupModalProduk() {
      document.getElementById("product-modal").classList.remove("active");
    }

    function simpanProduk(event) {
      event.preventDefault();
      const produk = getProducts();

      const dataBaru = {
        nama: document.getElementById("p-nama").value,
        harga: parseInt(document.getElementById("p-harga").value, 10),
        gambar: document.getElementById("p-gambar").value,
        kategori: document.getElementById("p-kategori").value,
        stok: parseInt(document.getElementById("p-stok").value, 10)
      };

      if (editIndex !== null) {
        dataBaru.id = produk[editIndex].id; // id tetap sama saat edit
        produk[editIndex] = dataBaru;
      } else {
        dataBaru.id = "produk-" + Date.now(); // id unik otomatis untuk produk baru
        produk.push(dataBaru);
      }

      saveProducts(produk);
      tutupModalProduk();
      renderTabelProduk();
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
        tampilkanPanelAdmin();
      }
    });
  </script>
</body>
</html>
