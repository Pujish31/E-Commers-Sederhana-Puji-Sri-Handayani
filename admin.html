<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Uji Jewelry Store</title>
  <style>
     { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #fdf6f0; color: #3a2a2a; min-height: 100vh; }

    .login-wrapper {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f6cfe0, #f9e4c8); padding: 20px;
    }
    .login-box {
      background: #fff; padding: 40px 30px; border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); width: 100%; max-width: 360px; text-align: center;
    }
    .login-box h1 { color: #7a3b53; font-size: 22px; margin-bottom: 6px; }
    .login-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 12px 14px; margin-bottom: 14px;
      border: 1px solid #e0c9d3; border-radius: 10px; outline: none; font-size: 14px;
    }
    .login-box input:focus { border-color: #d17ca0; }
    .btn-login {
      width: 100%; background: #7a3b53; color: #fff; border: none;
      padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold;
      cursor: pointer; transition: .2s;
    }
    .btn-login:hover { background: #5c2c3f; }
    .login-error { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }
    .back-link { display: inline-block; margin-top: 16px; font-size: 13px; color: #b45c81; text-decoration: none; }

    .admin-header {
      background: #7a3b53; color: #fff; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .admin-header h1 { font-size: 20px; }
    .btn-logout {
      background: #fce8f0; color: #7a3b53; border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .admin-container { padding: 24px; max-width: 1000px; margin: 0 auto; }
    .admin-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .admin-toolbar input {
      padding: 8px 14px; border: 1px solid #e0c9d3; border-radius: 20px; width: 220px; outline: none;
    }
    .btn-save-all {
      background: #d17ca0; color: #fff; border: none; padding: 10px 20px;
      border-radius: 20px; font-weight: bold; cursor: pointer;
    }
    .btn-save-all:hover { background: #b45c81; }

    table.stok-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .stok-table th, .stok-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #f0e4e8; font-size: 14px; }
    .stok-table th { background: #fce8f0; color: #7a3b53; }
    .stok-table img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: #eee; vertical-align: middle; margin-right: 8px; }
    .produk-cell { display: flex; align-items: center; }
    .stok-input {
      width: 70px; padding: 6px 8px; border: 1px solid #e0c9d3; border-radius: 8px; text-align: center; font-size: 14px;
    }
    .badge-habis { color: #c0392b; font-weight: bold; font-size: 12px; }
    .badge-ada { color: #2e7d32; font-weight: bold; font-size: 12px; }
    .btn-save-row {
      background: #7a3b53; color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-size: 12px; cursor: pointer;
    }
    .btn-save-row:hover { background: #5c2c3f; }
    .save-toast {
      position: fixed; bottom: 20px; right: 20px; background: #7a3b53; color: #fff;
      padding: 12px 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 2000;
    }

    @media (max-width: 600px) {
      .stok-table th:nth-child(3), .stok-table td:nth-child(3) { display: none; } /* sembunyikan kolom kategori di HP */
      .admin-toolbar input { width: 100%; }
      .stok-table th, .stok-table td { padding: 8px; font-size: 12px; }
      .stok-table img { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper" id="login-wrapper">
    <div class="login-box">
      <h1>Admin Login</h1>
      <p>Uji Jewelry Store</p>
      <input type="text" id="username" placeholder="Username" autocomplete="username" />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button class="btn-login" onclick="login()">Masuk</button>
      <div class="login-error" id="login-error"></div>
      <a href="index.html" class="back-link">&larr; Kembali ke Toko</a>
    </div>
  </div>

  <div id="admin-panel" style="display:none;">
    <div class="admin-header">
      <h1>Kelola Stok Produk</h1>
      <div>
        <a href="index.html" style="color:#fce8f0; margin-right:14px; font-size:13px;">Lihat Toko</a>
        <button class="btn-logout" onclick="logout()">Keluar</button>
      </div>
    </div>

    <div class="admin-container">
      <div class="admin-toolbar">
        <input type="text" id="admin-search" placeholder="Cari produk..." oninput="renderTabelStok()" />
        <button class="btn-save-all" onclick="simpanSemuaStok()">Simpan Semua Perubahan</button>
      </div>

      <table class="stok-table">
        <thead>
          <tr>
            <th>Produk</th>
            <th>Kategori</th>
            <th>Status</th>
            <th>Stok</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabel-stok-body">
          <!-- diisi otomatis lewat JS -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="save-toast" id="save-toast">Perubahan disimpan!</div>

  <script src="script.js"></script>
  <script>

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "admin123";

    const masterProduk = [
      { nama: "Silver Pink", kategori: "Pink", gambar: "simplepink.jpg" },
      { nama: "Rosa", kategori: "Pink", gambar: "Rosa.jpg" },
      { nama: "Crystal Beaded Bracelet Set", kategori: "Pink", gambar: "Crystal Beaded Bracelet Set.jpg" },
      { nama: "Pink Bracelet", kategori: "Pink", gambar: "Pink Bracelet.jpg" },
      { nama: "Rose gold Cubic", kategori: "Pink", gambar: "Rose gold Cubic.jpg" },
      { nama: "Classic Gold", kategori: "Gold", gambar: "gold.jpg" },
      { nama: "Luxury Gold", kategori: "Gold", gambar: "Luxury Gold.jpg" },
      { nama: "Elegant Gold & Pearl", kategori: "Gold", gambar: "Elegant Gold & Pearl.jpg" },
      { nama: "Bracelet Gold", kategori: "Gold", gambar: "Bracelet Gold.jpg" },
      { nama: "Set Pearl", kategori: "Gold", gambar: "set pearl.jpg" },
      { nama: "Vintage Retro", kategori: "Vintage", gambar: "vintage.jpg" },
      { nama: "Vintage Rings", kategori: "Vintage", gambar: "Vintage rings.jpg" },
      { nama: "Charm Bracelet", kategori: "Vintage", gambar: "charm bracelets.jpg" },
      { nama: "Bracelet Watch", kategori: "Vintage", gambar: "Bracelet Watch.jpg" },
      { nama: "Watch Set", kategori: "Vintage", gambar: "Watch Bracele.jpg" },
      { nama: "Y2K shiny", kategori: "Y2K", gambar: "Y2K.jpg" },
      { nama: "Pink Butterfly", kategori: "Y2K", gambar: "Pink Butterfly.jpg" },
      { nama: "Punk Gothic", kategori: "Y2K", gambar: "Punk Gothic.jpg" },
      { nama: "Y2K Colorful", kategori: "Y2K", gambar: "Y2K Style Colorful Pentagram.jpg" },
      { nama: "Y2K Ring", kategori: "Y2K", gambar: "Kpop Ring Y2K.jpg" }
    ];

    const stokDefault = {
      "Silver Pink": 10, "Rosa": 1, "Crystal Beaded Bracelet Set": 0, "Pink Bracelet": 7,
      "Rose gold Cubic": 3, "Classic Gold": 9, "Luxury Gold": 0, "Elegant Gold & Pearl": 5,
      "Bracelet Gold": 8, "Set Pearl": 3, "Vintage Retro": 9, "Vintage Rings": 10,
      "Charm Bracelet": 8, "Bracelet Watch": 5, "Watch Set": 4, "Y2K shiny": 10,
      "Pink Butterfly": 6, "Punk Gothic": 9, "Y2K Colorful": 9, "Y2K Ring": 8
    };

    function pastikanStokAda() {
      const stokData = getStokData();
      let ada = false;
      masterProduk.forEach(p => {
        if (!(p.nama in stokData)) {
          stokData[p.nama] = stokDefault[p.nama] !== undefined ? stokDefault[p.nama] : 0;
          ada = true;
        }
      });
      if (ada) saveStokData(stokData);
    }

    function login() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const errorEl = document.getElementById("login-error");

  if (u === "" || p === "") {
    errorEl.innerText = "Nama dan sandi wajib diisi!";
    return;
  }

  sessionStorage.setItem("isAdminLoggedIn", "true");
  sessionStorage.setItem("adminNama", u);
  errorEl.innerText = "";
  tampilkanPanelAdmin();
}

    function tampilkanPanelAdmin() {
  document.getElementById("login-wrapper").style.display = "none";
  document.getElementById("admin-panel").style.display = "block";

  const nama = sessionStorage.getItem("adminNama");
  const headerH1 = document.querySelector(".admin-header h1");
  if (nama && headerH1) headerH1.innerText = "Kelola Stok Produk — Halo, " + nama;

  pastikanStokAda();
  renderTabelStok();
}
    
    function logout() {
      sessionStorage.removeItem("isAdminLoggedIn");
      document.getElementById("admin-panel").style.display = "none";
      document.getElementById("login-wrapper").style.display = "flex";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    function tampilkanPanelAdmin() {
      document.getElementById("login-wrapper").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      pastikanStokAda();
      renderTabelStok();
    }

    // Login pakai Enter
    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") login();
    });

    function renderTabelStok() {
      const stokData = getStokData();
      const kataKunci = (document.getElementById("admin-search")?.value || "").toLowerCase();
      const tbody = document.getElementById("tabel-stok-body");

      const produkTampil = masterProduk.filter(p => p.nama.toLowerCase().includes(kataKunci));

      tbody.innerHTML = produkTampil.map(p => {
        const stokSaatIni = stokData[p.nama] !== undefined ? stokData[p.nama] : 0;
        const statusBadge = stokSaatIni <= 0
          ? '<span class="badge-habis">Habis</span>'
          : '<span class="badge-ada">Tersedia</span>';

        return `
          <tr>
            <td>
              <div class="produk-cell">
                <img src="${p.gambar}" onerror="this.style.display='none'">
                <span>${p.nama}</span>
              </div>
            </td>
            <td>${p.kategori}</td>
            <td>${statusBadge}</td>
            <td>
              <input type="number" min="0" class="stok-input" id="stok-${cssId(p.nama)}" value="${stokSaatIni}">
            </td>
            <td>
              <button class="btn-save-row" onclick="simpanStokSatuan('${escapeJS(p.nama)}')">Simpan</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function cssId(nama) {
      return nama.replace(/[^a-zA-Z0-9]/g, "-");
    }
    function escapeJS(str) {
      return str.replace(/'/g, "\\'");
    }

    function simpanStokSatuan(nama) {
      const input = document.getElementById("stok-" + cssId(nama));
      const nilaiBaru = Math.max(0, parseInt(input.value, 10) || 0);

      const stokData = getStokData();
      stokData[nama] = nilaiBaru;
      saveStokData(stokData);

      tampilkanToast(nama + " diperbarui jadi " + nilaiBaru + " stok.");
      renderTabelStok();
    }

    function simpanSemuaStok() {
      const stokData = getStokData();
      masterProduk.forEach(p => {
        const input = document.getElementById("stok-" + cssId(p.nama));
        if (input) {
          stokData[p.nama] = Math.max(0, parseInt(input.value, 10) || 0);
        }
      });
      saveStokData(stokData);
      tampilkanToast("Semua perubahan stok berhasil disimpan!");
      renderTabelStok();
    }

    function tampilkanToast(pesan) {
      const toast = document.getElementById("save-toast");
      toast.innerText = pesan;
      toast.style.opacity = "1";
      setTimeout(() => (toast.style.opacity = "0"), 2000);
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
        tampilkanPanelAdmin();
      }
    });
  </script>
</body>
</html>
