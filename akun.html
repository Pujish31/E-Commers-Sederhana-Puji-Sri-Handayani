<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akun Saya - Uji Jewelry Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #fdf6f0; color: #3a2a2a; min-height: 100vh; }

    .header { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .navbar { width: 90%; max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
    .logo { font-size: 22px; font-weight: bold; color: #d17ca0; }
    .navbar a { text-decoration: none; color: #7a3b53; font-weight: 600; font-size: 14px; }

    .wrap { max-width: 420px; margin: 50px auto; padding: 0 16px; }

    .tabs { display: flex; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 14px; text-align: center; cursor: pointer; font-weight: bold; color: #999; background: #fff; border: none; font-size: 14px; }
    .tab-btn.active { color: #7a3b53; background: #fce8f0; }

    .card { background: #fff; border-radius: 14px; padding: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .card h2 { color: #7a3b53; margin-bottom: 4px; font-size: 20px; }
    .card p.sub { color: #999; font-size: 13px; margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
    .btn-submit { width: 100%; margin-top: 20px; background: #7a3b53; color: #fff; border: none; padding: 12px; border-radius: 25px; font-size: 15px; cursor: pointer; }
    .btn-submit:hover { background: #5c2c3f; }
    .form-msg { font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    .form-msg.error { color: #c0392b; }
    .form-msg.success { color: #2e7d32; }

    /* PROFIL SETELAH LOGIN */
    .profile-wrap { display: none; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .profile-card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .profile-card h2 { color: #7a3b53; margin-bottom: 10px; }
    .profile-info p { font-size: 14px; margin-bottom: 6px; color: #5c3b4b; }
    .btn-logout { background: #eee; color: #333; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; margin-top: 10px; }

    .order-item { background: #fdf6f0; border-radius: 10px; padding: 14px; margin-bottom: 10px; font-size: 14px; }
    .order-item .order-head { display: flex; justify-content: space-between; font-weight: bold; color: #7a3b53; margin-bottom: 6px; }
    .order-item ul { padding-left: 18px; margin: 6px 0; color: #5c3b4b; }
    .no-orders { text-align: center; color: #999; padding: 20px 0; }
  </style>
</head>
<body>

  <header class="header">
    <nav class="navbar">
      <div class="logo">Uji Jewelry</div>
      <a href="index.html">&larr; Kembali ke Toko</a>
    </nav>
  </header>

  <!-- ===== FORM LOGIN/DAFTAR (tampil jika belum login) ===== -->
  <div class="wrap" id="auth-wrap">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="gantiTab('login')">Masuk</button>
      <button class="tab-btn" id="tab-register" onclick="gantiTab('register')">Daftar Akun</button>
    </div>

    <!-- LOGIN -->
    <div class="card" id="card-login">
      <h2>Masuk ke Akun</h2>
      <p class="sub">Belanja jadi lebih cepat dengan akun kamu.</p>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required placeholder="email@contoh.com">

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="Password">

        <button type="submit" class="btn-submit">Masuk</button>
        <p class="form-msg error" id="login-msg">Email atau password salah.</p>
      </form>
    </div>

    <!-- DAFTAR -->
    <div class="card" id="card-register" style="display:none;">
      <h2>Buat Akun Baru</h2>
      <p class="sub">Isi data di bawah untuk mendaftar.</p>
      <form id="register-form">
        <label for="reg-nama">Nama Lengkap</label>
        <input type="text" id="reg-nama" required placeholder="Nama lengkap">

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required placeholder="email@contoh.com">

        <label for="reg-telepon">Nomor Telepon</label>
        <input type="tel" id="reg-telepon" required placeholder="08xxxxxxxxxx">

        <label for="reg-alamat">Alamat</label>
        <input type="text" id="reg-alamat" required placeholder="Alamat lengkap">

        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required placeholder="Buat password" minlength="4">

        <button type="submit" class="btn-submit">Daftar</button>
        <p class="form-msg error" id="register-msg">Email sudah terdaftar.</p>
      </form>
    </div>
  </div>

  <!-- ===== PROFIL (tampil jika sudah login) ===== -->
  <div class="profile-wrap" id="profile-wrap">
    <div class="profile-card">
      <h2 id="profile-nama">Halo, Pelanggan!</h2>
      <div class="profile-info">
        <p id="profile-email"></p>
        <p id="profile-telepon"></p>
        <p id="profile-alamat"></p>
      </div>
      <button class="btn-logout" onclick="logoutCustomer()">Keluar</button>
      <button class="btn-logout" id="btn-panel-admin" style="display:none; background:#7a3b53; color:#fff; margin-left:8px;" onclick="window.location.href='admin.html'">Buka Panel Admin</button>
    </div>

    <div class="profile-card">
      <h2>Riwayat Pesanan</h2>
      <div id="order-history">
        <!-- diisi otomatis -->
      </div>
    </div>
  </div>

  <script>
    // ================== FUNGSI AKUN PELANGGAN ==================
    function getCustomers() {
      return JSON.parse(localStorage.getItem("customers")) || [];
    }
    function saveCustomers(list) {
      localStorage.setItem("customers", JSON.stringify(list));
    }
    function getCurrentCustomerEmail() {
      return localStorage.getItem("currentCustomerEmail");
    }
    function formatRupiah(angka) {
      return "Rp " + Number(angka).toLocaleString("id-ID");
    }

    // Seed satu akun admin default kalau belum ada akun admin sama sekali
    function seedAdminAccount() {
      const customers = getCustomers();
      const sudahAdaAdmin = customers.some(c => c.role === "admin");
      if (!sudahAdaAdmin) {
        customers.push({
          nama: "Admin Uji Jewelry",
          email: "admin@ujijewelry.com",
          telepon: "-",
          alamat: "-",
          password: "admin123",
          role: "admin"
        });
        saveCustomers(customers);
      }
    }
    seedAdminAccount();

    // ================== TAB LOGIN/DAFTAR ==================
    function gantiTab(tab) {
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-register").classList.toggle("active", tab === "register");
      document.getElementById("card-login").style.display = tab === "login" ? "block" : "none";
      document.getElementById("card-register").style.display = tab === "register" ? "block" : "none";
    }

    // ================== DAFTAR ==================
    document.getElementById("register-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const nama = document.getElementById("reg-nama").value;
      const email = document.getElementById("reg-email").value.toLowerCase().trim();
      const telepon = document.getElementById("reg-telepon").value;
      const alamat = document.getElementById("reg-alamat").value;
      const password = document.getElementById("reg-password").value;

      const customers = getCustomers();
      if (customers.some(c => c.email === email)) {
        document.getElementById("register-msg").style.display = "block";
        return;
      }

      customers.push({ nama, email, telepon, alamat, password, role: "customer" });
      saveCustomers(customers);
      localStorage.setItem("currentCustomerEmail", email);
      tampilkanProfil();
    });

    // ================== LOGIN ==================
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.toLowerCase().trim();
      const password = document.getElementById("login-password").value;

      const customers = getCustomers();
      const found = customers.find(c => c.email === email && c.password === password);

      if (!found) {
        document.getElementById("login-msg").style.display = "block";
        return;
      }

      localStorage.setItem("currentCustomerEmail", email);
      tampilkanProfil();
    });

    // ================== LOGOUT ==================
    function logoutCustomer() {
      localStorage.removeItem("currentCustomerEmail");
      document.getElementById("profile-wrap").style.display = "none";
      document.getElementById("auth-wrap").style.display = "block";
    }

    // ================== TAMPILKAN PROFIL & RIWAYAT ==================
    function tampilkanProfil() {
      const email = getCurrentCustomerEmail();
      const customer = getCustomers().find(c => c.email === email);
      if (!customer) return;

      document.getElementById("auth-wrap").style.display = "none";
      document.getElementById("profile-wrap").style.display = "block";

      document.getElementById("profile-nama").innerText = "Halo, " + customer.nama + "!";
      document.getElementById("profile-email").innerText = "Email: " + customer.email;
      document.getElementById("profile-telepon").innerText = "Telepon: " + customer.telepon;
      document.getElementById("profile-alamat").innerText = "Alamat: " + customer.alamat;

      document.getElementById("btn-panel-admin").style.display =
        customer.role === "admin" ? "inline-block" : "none";

      renderRiwayatPesanan(email);
    }

    function renderRiwayatPesanan(email) {
      const semuaOrder = JSON.parse(localStorage.getItem("orders")) || [];
      const orderSaya = semuaOrder.filter(o => o.email === email).reverse();
      const container = document.getElementById("order-history");

      if (orderSaya.length === 0) {
        container.innerHTML = '<p class="no-orders">Belum ada pesanan.</p>';
        return;
      }

      container.innerHTML = orderSaya
        .map(
          o => `
        <div class="order-item">
          <div class="order-head">
            <span>${o.noPesanan}</span>
            <span>${formatRupiah(o.total)}</span>
          </div>
          <div style="color:#999; font-size:12px;">${o.tanggal} &middot; ${o.pembayaran}</div>
          <ul>
            ${o.items.map(it => `<li>${it.nama} x${it.qty}</li>`).join("")}
          </ul>
        </div>
      `
        )
        .join("");
    }

    // ================== CEK STATUS SAAT HALAMAN DIBUKA ==================
    document.addEventListener("DOMContentLoaded", function () {
      if (getCurrentCustomerEmail()) {
        tampilkanProfil();
      }
    });
  </script>
</body>
</html>
