<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="logo">Uji Jewelry</div>
      <ul class="nav-links">
        <li><a href="index.html">Beranda</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Keranjang Belanja</h1>
    <div id="cart-list"></div>
    <h2 id="total-price"></h2>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const cartList = document.getElementById("cart-list");
      const totalPrice = document.getElementById("total-price");
      let total = 0;

      if (cart.length === 0) {
        cartList.innerHTML = "<p>Keranjang masih kosong.</p>";
        totalPrice.innerText = "";
        return;
      }

      cart.forEach(function (item) {
        const hargaAngka = parseInt(item.harga.replace(/[^0-9]/g, ""));
        total += hargaAngka;

        cartList.innerHTML += `
          <div class="cart-item">
            <img src="${item.gambar}" alt="${item.nama}" width="120">
            <div>
              <h3>${item.nama}</h3>
              <p>${item.harga}</p>
              <p>Kategori: ${item.kategori}</p>
            </div>
          </div>
        `;
      });

      totalPrice.innerText = "Total: Rp " + total.toLocaleString("id-ID");
    });
  </script>
</body>
</html>
